<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="login-card">
        <h2>Accesso Portale</h2>

        <!-- Se Spring Security rileva un errore di login, mostra questo -->
        <div th:if="${param.error}" class="alert-error">
            Credenziali non valide. Riprova.
        </div>
<!-- 
        Se l'utente ha fatto il logout, mostra questo
        <div th:if="${param.logout}" class="alert-logout">
            Logout effettuato con successo.
        </div>
        Da spostare nella home perchè il messaggio viene visualizzato nella pagina dove atterra dopo il logout(con il parametro "?logout" nell url)
-->
        <!-- Se l'utente ha fatto il logout, mostra questo -->
        <div th:if="${param.logout}" class="alert-logout">
            Logout effettuato con successo.
        </div>

        <!-- IMPORTANTE: Il form deve puntare a POST /login con campi name="username" e name="password" -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email / Username</label>
                <input type="text" id="username" name="username" required autofocus />
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />
            </div>

            <button type="submit">Accedi</button>
        </form>
    </div>
    
</body>
</html>
