<!-- 
template: client portal registration page -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
    <link rel="icon" th:href="@{/images/gardening.png}" type="image/png">
</head>

<body>
    <div th:replace="~{navbar/navbar-home :: navbar}"></div>

    <section class="registration-page">
        <div class="registration-card">
            <h1>Registrati al Portale Clienti</h1>
            <p>Compila il modulo per creare il tuo account e tenere traccia delle richieste.</p>

            <form class="registration-form" th:action="@{/register}" th:object="${registrazione}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label>
                    Nome
                    <input type="text" th:field="*{nome}" placeholder=" Nome " required>
                </label>
                <label>
                    Cognome
                    <input type="text" th:field="*{cognome}" placeholder=" Cognome" required>
                </label>
                <label>
                    Email
                    <input type="email" th:field="*{email}" placeholder="tuo@email.com" required>
                </label>
                <label>
                    Cellulare
                    <input id="phoneNumber" name="telefono" class="phone-number" type="tel" placeholder="123 456 7890"
                        required>
                </label>
                <label>
                    Password
                    <input type="password" th:field="*{password}" placeholder="Password" required>
                </label>
                <label>
                    Conferma la password
                    <input type="password" th:field="*{passwordConfirm}" placeholder="Conferma la password" required>
                </label>
                <p class="form-error" th:if="${passwordError}" th:text="${passwordError}"></p>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Registrati</button>
                </div>
            </form>

            <div class="success-actions">
                <span>Hai già un account?</span>
                <a th:href="@{/login}" class="btn-primary secondary">Vai al Login</a>
            </div>
        </div>
    </section>

    <div th:replace="~{fragment/footer :: footer}"></div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scrollButton.js}"></script>
</body>

</html>
