<!-- Preventivo template: quote request page with submission form -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Richiedi Preventivo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
    <link rel="icon" th:href="@{/images/gardening.png}" type="image/png">
</head>

<body>

    <div th:replace="~{navbar/navbar-home :: navbar}"></div>

    <section class="preventivo-page">
        <div class="page-header">

            <h1>Richiedi il tuo preventivo</h1>

            <p>
                Compila il modulo e ti contatteremo al più presto
                con una proposta personalizzata.
            </p>

            <div class="preventivo-card">

                <div th:if="${successMessage}" class="alert success">
                    <p th:text="${successMessage}"></p>
                </div>

                <form th:action="@{/preventivo}" th:object="${preventivoRequest}" method="post" class="preventivo-form">

                    <div class="form-grid">

                        <label>
                            Nome
                            <input type="text" th:field="*{nome}" placeholder="Nome e Cognome" required>
                        </label>

                        <label>
                            Email
                            <input type="email" th:field="*{email}" placeholder="tuo@email.com" required>
                        </label>

                        <label>
                            Telefono
                            <div style="display:flex;gap:8px;align-items:center;">

                                <select id="phonePrefix" class="phone-prefix" aria-label="Prefisso">

                                    <option value="+39" selected>🇮🇹 +39 (IT)</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+351">🇵🇹 +351</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+31">🇳🇱 +31</option>

                                </select>

                                <input id="phoneNumber" class="phone-number" type="tel" th:field="*{telefono}"
                                    placeholder="123 456 7890" inputmode="numeric" pattern="[0-9 ]+"
                                    title="Inserisci solo numeri nel numero di telefono" required>
                            </div>
                        </label>

                        <label>
                            Indirizzo
                            <input type="text" th:field="*{indirizzo}" placeholder="Via, città" required>
                        </label>

                        <label>
                            Servizio richiesto

                            <select th:field="*{servizio}" required>

                                <option value="">
                                    Seleziona un servizio
                                </option>

                                <option th:each="opt : ${serviziOptions}" th:value="${opt.value}"
                                    th:text="${opt.label}">
                                </option>

                            </select>
                        </label>

                        <label>
                            Dimensioni del giardino

                            <input type="number" th:field="*{dimensioni}" placeholder="Es. 150" min="1" step="1"
                                required>
                        </label>

                    </div>

                    <label class="full-width">
                        Dettagli aggiuntivi

                        <textarea th:field="*{dettagli}" rows="6"
                            placeholder="Descrivi il lavoro desiderato"></textarea>
                    </label>

                    <div class="form-actions">

                        <button type="submit" class="btn-primary">
                            Invia richiesta
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </section>

    <div th:replace="~{fragment/footer :: footer}"></div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scrollButton.js}"></script>

    <script>
        (function () {

            const form = document.querySelector('.preventivo-form');
            const phoneInput = document.getElementById('phoneNumber');

            if (!form || !phoneInput) return;

            // Permette solo numeri e spazi durante la digitazione
            phoneInput.addEventListener('input', function () {
                this.value = this.value.replace(/[^0-9 ]/g, '');
                this.setCustomValidity('');
            });

            form.addEventListener('submit', function (event) {

                const prefix =
                    document.getElementById('phonePrefix')?.value || '';

                const raw = phoneInput.value.trim();

                // Controlla che siano presenti solo numeri e spazi
                if (!/^[0-9 ]+$/.test(raw)) {

                    event.preventDefault();

                    phoneInput.setCustomValidity(
                        'Inserisci solo numeri nel numero di telefono.'
                    );

                    phoneInput.reportValidity();

                    return;
                }

                phoneInput.setCustomValidity('');

                // Aggiunge il prefisso internazionale
                if (raw && !raw.startsWith(prefix)) {
                    phoneInput.value = prefix + ' ' + raw;
                }

            });

        })();
    </script>

</body>

</html>
