<!-- Preventivo template: quote request page with submission form -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Richiedi Preventivo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
    <link rel="icon" th:href="@{/images/gardening.png}" type="image/png">

    <!-- FullCalendar v6 JS e Lingua Italiana -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>

    <!-- Stile per personalizzare il calendario integrato nei colori del tema -->
    <style>
        .calendar-section {
            grid-column: span 2;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .calendar-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #edf3df;
        }

        #calendar {
            background-color: rgba(31, 50, 34, 0.9);
            border: 1px solid rgba(184, 206, 168, 0.35);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-light);
            min-height: 380px;
        }

        .fc-theme-standard td, .fc-theme-standard th {
            border-color: rgba(184, 206, 168, 0.2) !important;
        }

        .fc .fc-toolbar-title {
            color: #eef4e6;
            font-size: 1.15rem;
            font-weight: 700;
        }

        /* Bottoni Avanti/Indietro/Oggi coerenti con la classe .btn-primary */
        .fc .fc-button-primary {
            background-color: var(--moss-green) !important;
            border-color: var(--moss-green) !important;
            color: #eef4e0 !important;
            border-radius: 12px !important;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .fc .fc-button-primary:hover {
            background-color: var(--olive-drab) !important;
            border-color: var(--olive-drab) !important;
        }

        .fc .fc-button-primary:disabled {
            background-color: rgba(122, 155, 88, 0.4) !important;
            border-color: transparent !important;
        }

        .fc .fc-daygrid-day-number {
            color: #c9d7b6;
            text-decoration: none;
        }

        .fc .fc-col-header-cell-cushion {
            color: #edf3df;
        }

        /* Cella selezionata dall'utente */
        .giorno-selezionato {
            background-color: var(--moss-green) !important;
            color: #ffffff !important;
            border-radius: 8px;
        }

        /* Testo della data formattata in bianco */
        .data-selected-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #ffffff;
            font-weight: 600;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div th:replace="~{navbar/navbar-home :: navbar}"></div>

    <section class="preventivo-page">
        <div class="page-header">

            <h1>Richiedi il tuo preventivo</h1>

            <p>
                Compila il modulo e ti contatteremo al più presto
                con una proposta personalizzata.
            </p>

            <div class="preventivo-card">

                <div th:if="${successMessage}" class="alert success">
                    <p th:text="${successMessage}"></p>
                </div>

                <form th:action="@{/preventivo}" th:object="${preventivoRequest}" method="post" class="preventivo-form">

                    <div class="form-grid">

                        <label>
                            Nome
                            <input type="text" th:field="*{nome}" placeholder="Nome e Cognome" required>
                        </label>

                        <label>
                            Email
                            <input type="email" th:field="*{email}" placeholder="tuo@email.com" required>
                        </label>

                        <label>
                            Telefono
                            <div style="display:flex;gap:8px;align-items:center;">

                                <select id="phonePrefix" class="phone-prefix" aria-label="Prefisso">

                                    <option value="+39" selected>🇮🇹 +39 (IT)</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+351">🇵🇹 +351</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+31">🇳🇱 +31</option>

                                </select>

                                <input id="phoneNumber" class="phone-number" type="tel" th:field="*{telefono}"
                                    placeholder="123 456 7890" inputmode="numeric" pattern="[0-9 ]+"
                                    title="Inserisci solo numeri nel numero di telefono" required>
                            </div>
                        </label>

                        <label>
                            Indirizzo
                            <input type="text" th:field="*{indirizzo}" placeholder="Via, città" required>
                        </label>

                        <label>
                            Servizio richiesto

                            <select th:field="*{servizio}" required>

                                <option value="">
                                    Seleziona un servizio
                                </option>

                                <option th:each="opt : ${serviziOptions}" th:value="${opt.value}"
                                    th:text="${opt.label}">
                                </option>

                            </select>
                        </label>

                        <label>
                            Dimensioni del giardino

                            <input type="number" th:field="*{dimensioni}" placeholder="Es. 150" min="1" step="1"
                                required>
                        </label>

                    </div>

                    <!-- BLOCCO CALENDARIO -->
                    <div class="calendar-section">
                        <label>Seleziona la data indicativa dell'intervento</label>
                        
                        <div id="calendar"></div>

                        <!-- Campo nascosto per inviare la data a Spring Boot -->
                        <input type="hidden" id="dataIntervento" th:field="*{dataIntervento}">

                        <p class="data-selected-info">
                            <span id="data-mostrata" style="color: #ffffff;"></span>
                        </p>
                    </div>

                    <label class="full-width">
                        Dettagli aggiuntivi

                        <textarea th:field="*{dettagli}" rows="6"
                            placeholder="Descrivi il lavoro desiderato"></textarea>
                    </label>

                    <div class="form-actions">

                        <button type="submit" class="btn-primary">
                            Invia richiesta
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </section>

    <div th:replace="~{fragment/footer :: footer}"></div>

    <!-- Script Generali -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scrollButton.js}"></script>

    <!-- Script Gestione Telefono e del Calendario -->
    <script th:src="@{/js/calendario-prenotazione.js}"></script>

</body>

</html>
