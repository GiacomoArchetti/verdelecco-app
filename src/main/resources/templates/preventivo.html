<!-- Preventivo template: quote request page with submission form -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Richiedi Preventivo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
    <link rel="icon" th:href="@{/images/gardening.png}" type="image/png">

    <!-- FullCalendar v6 JS e Lingua Italiana -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>

    <!-- SCRIPT PER IL CONTEGGIO CARATTERI -->
    <script th:src="@{/js/char-counter.js}" defer></script>

    <!-- Stile per personalizzare il calendario integrato nei colori del tema -->
    <link rel="stylesheet" th:href="@{/css/calendario.css(v=2.0)}">
</head>

<body>

    <div th:replace="~{navbar/navbar-home :: navbar}"></div>

    <section class="preventivo-page">
        <div class="page-header">

            <h1>Richiedi il tuo preventivo</h1>

            <p>
                Compila il modulo e ti contatteremo al più presto
                con una proposta personalizzata.
            </p>

            <div class="preventivo-card">

                <div th:if="${successMessage}" class="alert success">
                    <p th:text="${successMessage}"></p>
                </div>

                <form th:action="@{/preventivo}" th:object="${preventivoRequest}" method="post" class="preventivo-form">

                    <div class="form-grid">

                        <label>
                            Nome
                            <input type="text" th:field="*{nome}" placeholder="Nome" required>
                        </label>

                        <label>
                            Cognome
                            <input type="text" th:field="*{nome}" placeholder="Cognome" required>
                        </label>

                        <label>
                            Email
                            <input type="email" th:field="*{email}" placeholder="tuo@email.com" required>
                        </label>

                        <label>
                            Telefono
                            <div style="display:flex;gap:8px;align-items:center;">

                                <select id="phonePrefix" class="phone-prefix" aria-label="Prefisso">

                                    <option value="+39" selected>🇮🇹 +39 (IT)</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+351">🇵🇹 +351</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+31">🇳🇱 +31</option>

                                </select>

                                <input id="phoneNumber" class="phone-number" type="tel" th:field="*{telefono}"
                                    placeholder="123 456 7890" inputmode="numeric" pattern="[0-9 ]+"
                                    title="Inserisci solo numeri nel numero di telefono" required>
                            </div>
                        </label>

                        <label>
                            Indirizzo
                            <input type="text" th:field="*{indirizzo}" placeholder="Via, città" required>
                        </label>

                        <label>
                            Servizio richiesto

                            <select th:field="*{servizio}" required>

                                <option value="">
                                    Seleziona un servizio
                                </option>

                                <option th:each="opt : ${serviziOptions}" th:value="${opt.value}"
                                    th:text="${opt.label}">
                                </option>

                            </select>
                        </label>

                        <label>Dimensioni del giardino (mq)
                            <input type="number" 
                                id="dimensioniInput"
                                th:field="*{dimensioni}" 
                                placeholder="Es. 150" 
                                min="1" 
                                step="1" 
                                value="10"
                                required>
                        </label>

                    </div>

                    <!-- BLOCCO CALENDARIO -->
                    <div class="calendar-section">
                        <label>Seleziona la data indicativa dell'intervento</label>
                        
                        <div id="calendar"></div>

                        <!-- Campo nascosto per inviare la data a Spring Boot -->
                        <input type="hidden" id="dataIntervento" th:field="*{dataIntervento}">

                        <p class="data-selected-info">
                            <span id="data-mostrata" style="color: #ffffff;"></span>
                        </p>
                    </div>

                    <label class="full-width">
                        Dettagli aggiuntivi

                        <textarea name="messaggio" maxlength="500" placeholder="Descrivi il lavoro desiderato"></textarea>
                    </label>

                    <div class="form-actions">

                        <button type="submit" class="btn-primary">
                            Invia richiesta
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </section>

    <div th:replace="~{fragment/footer :: footer}"></div>

    <!-- Script Generali -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scrollButton.js}"></script>

    <!-- Script Gestione Telefono e del Calendario -->
    <script th:src="@{/js/calendario-prenotazione.js}"></script>

</body>

</html>
