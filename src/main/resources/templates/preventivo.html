<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Richiedi Preventivo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
    <link rel="icon" th:href="@{/images/gardening.png}" type="image/png">

    <!-- FullCalendar v6 JS e Lingua Italiana -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>

    <!-- Stile per personalizzare il calendario integrato nei colori del tema -->
    <link rel="stylesheet" th:href="@{/css/calendario.css(v=2.0)}">
</head>

<body>

    <div th:replace="~{navbar/navbar-home :: navbar}"></div>

    <section class="preventivo-page">
        <div class="page-header">

            <h1>Richiedi il tuo preventivo</h1>

            <p>
                Compila il modulo e ti contatteremo al più presto
                con una proposta personalizzata.
            </p>

            <div class="preventivo-card">

                <!-- FEEDBACK GLOBALI UNIFORMATI -->
                <p th:if="${successMessage}" class="feedback feedback-success" th:text="${successMessage}"></p>
                <p th:if="${errorMessage}" class="feedback feedback-error" th:text="${errorMessage}"></p>

                <form th:action="@{/preventivo}" th:object="${preventivoRequest}" method="post" class="preventivo-form">

                    <div class="form-grid">

                        <label>
                            Nome
                            <input type="text" th:field="*{nome}" 
                                   th:classappend="${#fields.hasErrors('nome')} ? 'input-error' : ''" 
                                   placeholder="Nome" required>
                            <p class="form-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
                        </label>

                        <label>
                            Cognome
                            <!-- Corretto il binding su cognome -->
                            <input type="text" th:field="*{cognome}" 
                                   th:classappend="${#fields.hasErrors('cognome')} ? 'input-error' : ''" 
                                   placeholder="Cognome" required>
                            <p class="form-error" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></p>
                        </label>

                        <label>
                            Email
                            <input type="email" th:field="*{email}" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''" 
                                   placeholder="tuo@email.com" required>
                            <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </label>

                        <label>
                            Telefono
                            <div style="display:flex;gap:8px;align-items:center;">
                                <select id="phonePrefix" class="phone-prefix" aria-label="Prefisso">
                                    <option value="+39" selected>🇮🇹 +39 (IT)</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+351">🇵🇹 +351</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+31">🇳🇱 +31</option>
                                </select>

                                <input id="phoneNumber" class="phone-number" type="tel" th:field="*{telefono}"
                                    th:classappend="${#fields.hasErrors('telefono')} ? 'input-error' : ''"
                                    placeholder="123 456 7890" inputmode="numeric" pattern="[0-9 ]+"
                                    title="Inserisci solo numeri nel numero di telefono" required>
                            </div>
                            <p class="form-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                        </label>

                        <label>
                            Indirizzo
                            <input type="text" th:field="*{indirizzo}" 
                                   th:classappend="${#fields.hasErrors('indirizzo')} ? 'input-error' : ''" 
                                   placeholder="Via, città" required>
                            <p class="form-error" th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}"></p>
                        </label>

                        <label>
                            Servizio richiesto
                            <select th:field="*{servizio}" 
                                    th:classappend="${#fields.hasErrors('servizio')} ? 'input-error' : ''" required>
                                <option value="">Seleziona un servizio</option>
                                <option th:each="opt : ${serviziOptions}" th:value="${opt.value}" th:text="${opt.label}"></option>
                            </select>
                            <p class="form-error" th:if="${#fields.hasErrors('servizio')}" th:errors="*{servizio}"></p>
                        </label>

                        <label>
                            Dimensioni del giardino (mq)
                            <input type="number" th:field="*{dimensioni}" 
                                   th:classappend="${#fields.hasErrors('dimensioni')} ? 'input-error' : ''" 
                                   placeholder="Es. 150" min="0" step="5" required>
                            <p class="form-error" th:if="${#fields.hasErrors('dimensioni')}" th:errors="*{dimensioni}"></p>
                        </label>

                    </div>

                    <!-- BLOCCO CALENDARIO -->
                    <div class="calendar-section">
                        <label>Seleziona la data indicativa dell'intervento</label>
                        
                        <div id="calendar"></div>

                        <!-- Campo nascosto per inviare la data a Spring Boot -->
                        <input type="hidden" id="dataIntervento" th:field="*{dataIntervento}" required th:errorclass="input-error">
                        <p class="form-error" th:if="${#fields.hasErrors('dataIntervento')}" th:errors="*{dataIntervento}"></p>

                        <p class="data-selected-info">
                            <span id="data-mostrata" style="color: #ffffff;"></span>
                        </p>
                    </div>

                    <label class="full-width">
                        Dettagli aggiuntivi
                        <textarea th:field="*{dettagli}" rows="6" placeholder="Descrivi il lavoro desiderato"></textarea>
                        <p class="form-error" th:if="${#fields.hasErrors('dettagli')}" th:errors="*{dettagli}"></p>
                    </label>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            Invia richiesta
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </section>

    <div th:replace="~{fragment/footer :: footer}"></div>

    <!-- Script Generali -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scrollButton.js}"></script>

    <!-- Script Gestione Telefono e del Calendario -->
    <script th:src="@{/js/calendario-prenotazione.js}"></script>

</body>

</html>
