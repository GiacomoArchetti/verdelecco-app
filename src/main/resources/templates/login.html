<!-- Login template: login page for existing customers -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Accedi</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/navbar-home.css}">
</head>

<body>
<div th:replace="~{navbar/navbar-home :: navbar}"></div>

<section class="registration-page">
    <div class="registration-card">
        <h1>Accedi al Portale Clienti</h1>
        <p>Inserisci le credenziali per accedere al tuo account.</p>

        <form class="registration-form" th:action="@{/accedi}" method="post">
            <label>
                Email
                <input type="email" name="email" placeholder="tuo@email.com" required>
            </label>
            <label>
                Password
                <input type="password" name="password" placeholder="Password" required>
            </label>
            <button type="submit" class="btn-primary">Accedi</button>
        </form>

        <div class="success-actions">
            <span>Non sei registrato?</span>
            <a th:href="@{/registrazione}" class="btn-primary secondary">Vai a Registrati</a>
        </div>
    </div>
</section>

<div th:replace="~{fragment/footer :: footer}"></div>

<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/scrollButton.js}"></script>
</body>

</html>
